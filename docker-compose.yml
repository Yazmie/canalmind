# ============================================================
# CanalMind 本地依赖编排
# 用法：docker compose up -d
# ============================================================
# 说明：PostgreSQL 使用 pgvector 官方镜像，开箱即带 vector 扩展；
#      首次启动会执行 docker/postgres/init/ 下的初始化脚本。
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: canalmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canalmind}
      POSTGRES_USER: ${POSTGRES_USER:-canalmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      # 中文排序与编码
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 初始化脚本：建扩展、建角色、灌 seed（按文件名顺序执行）
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canalmind} -d ${POSTGRES_DB:-canalmind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      # 中文全文检索所需；按需启用 zhparser（见 docker/postgres/init）
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "max_connections=100"

  redis:
    image: redis:7-alpine
    container_name: canalmind-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: canalmind-pgdata
  redisdata:
    name: canalmind-redisdata
