# ============================================================
# CanalMind 后端配置
#
# ⚠️ 关键（踩过一次坑，务必先读）：
#    Spring Boot **不会自动读取 .env 文件**。仅仅在下面写 `${DEEPSEEK_API_KEY:}`
#    占位符是没用的——占位符只从「进程环境变量 / JVM 系统属性 / 已加载的配置源」
#    取值，而仓库根目录那个 .env 默认不在其中。
#    所以必须在 spring.config.import 里把它**显式导入**（见下），
#    ${} 桥接才会有值。曾因缺这一步，启动直接报
#    `DeepSeek API key must be set`，即使 .env 里密钥填得好好的。
#
#    Spring AI 读的配置键是 `spring.ai.deepseek.*`，
#    属性名来源（非猜测）：spring-ai-autoconfigure-model-deepseek-1.1.2.jar
#      → META-INF/spring-configuration-metadata.json（共 23 个属性）
# ============================================================
spring:
  application:
    name: canalmind-api

  config:
    # 把 .env 当 properties 文件导入（.env 的 `KEY = VALUE` 语法与 properties 兼容）。
    # 两个路径都写，因为「工作目录」会随启动方式变化：
    #   - `cd backend && mvn spring-boot:run`  → 工作目录是 backend/，命中 ../
    #   - 在仓库根跑 `java -jar backend/target/*.jar` → 命中 ./
    # 用 optional: 前缀是刻意的：文件不存在时不报错（例如他人 clone 后还没建 .env），
    # 而是让下面的密钥占位符留空——由 Spring AI 快速失败给出清晰报错。
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"

  # ============================================================
  # 数据库（第 2 周第 3 项：PgVector 入库 / 检索通道）
  #
  # ⚠️ 默认端口为什么是 55432，而不是本机服务常用的 5432：
  #   1) 用户自己的 postgresql-x64-18 服务（5432）当前**已停止**，
  #      且其 postgres 口令**未知**（进度看板 §4 末、§6）；
  #   2) 第 2 周的 pgvector 0.8.0 / HNSW 验证全部跑在**临时集群**上
  #      （`D:\Project_AI\.pgtest\data`，端口 55432，口令 canalmind_test），
  #      V3 迁移用 `psql -f` 手工应用（本项目**不引入 Flyway**，见 pom.xml 注释）。
  #   → 55432 是**当下可用、可复现**的默认值；**5432 是最终目标**
  #     （服务恢复后只改环境变量即可，不需要改代码）。
  #
  # ⚠️ 切换到 5432 的正确做法（本文件实测确认过，别只改一个变量）：
  #   下面的 url 默认值是**整条拼好的字符串**，它**不读** `POSTGRES_PORT`——
  #   所以只改 `POSTGRES_PORT` 是**无效的**，必须直接覆盖 `POSTGRES_URL`：
  #       POSTGRES_URL=jdbc:postgresql://127.0.0.1:5432/canalmind
  #   用户名/口令则分别由 `POSTGRES_USER` / `POSTGRES_PASSWORD` 提供。
  #
  # ⚠️ 口令默认值刻意留空：口令只从环境变量 / .env 取，**不写进仓库**
  #    （.env 已在 .gitignore；本地验证集群的口令是 canalmind_test，由 .env 提供）。
  #
  # ⚠️ 这里只配 DataSource，**不加** spring.flyway.*：加了 Flyway 自动配置会让应用启动时
  #    自动跑迁移，与"迁移由 psql -f 手工应用、且 DDL 有 pgvector 依赖"的现状冲突。
  # ============================================================
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:55432/canalmind}
    # ⚠️ 默认值用 canalmind 而不是 postgres：与 .env 的 `POSTGRES_USER=canalmind` 保持一致。
    #    曾出现"默认 postgres 但 .env 是 canalmind"的错位，会导致启动时角色不存在。
    username: ${POSTGRES_USER:canalmind}
    password: ${POSTGRES_PASSWORD:}

  ai:
    deepseek:
      # 来自上一步导入的 .env；也可用真实环境变量覆盖（环境变量优先级更高）。
      # 留空时应用会**快速失败**并提示 "DeepSeek API key must be set"，
      # 这是刻意的——宁可启动就报错，也不要等到第一次问答才失败。
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
          # 业务问答要求稳定复现，温度调低；评测可复现性依赖这一点
          temperature: 0.1

    # ============================================================
    # Ollama + bge-m3（第 2 周 embedding，决策 C-22）
    #
    # ⚠️ 当前只作为**配置占位与口径统一**：本仓库的入库入口是独立命令行
    #    PgVectorIngestCli，它自己读 OLLAMA_BASE_URL / OLLAMA_EMBEDDING_MODEL /
    #    OLLAMA_EMBEDDING_DIMENSION；此处写同一批环境变量，是为了让
    #    "应用配置"与"离线入库脚本"两处口径一致，将来把检索接进主链路时直接生效。
    #    （spring-ai-starter-model-ollama 尚未引入，见 pom.xml 注释；未引入时这些属性不会被绑定。）
    #
    # ⚠️ 属性名不是猜的：从 spring-ai-autoconfigure-model-ollama-1.1.2.jar 的
    #    META-INF/spring-configuration-metadata.json 实测读出，存在
    #    `spring.ai.ollama.base-url` 与 `spring.ai.ollama.embedding.model`
    #    （后者等价于 `spring.ai.ollama.embedding.options.model`）。
    #    依据：进度看板 §4「Ollama + bge-m3」一节的同一做法。
    # ============================================================
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

server:
  port: ${SERVER_PORT:8080}
  # SSE 是长连接：Tomcat 的异步超时不能太小，否则长回答会被掐断
  tomcat:
    connection-timeout: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.canalmind: DEBUG
    # ⚠️ DEBUG 会打印提示词正文，正式环境务必调回 INFO
    org.springframework.ai: INFO
